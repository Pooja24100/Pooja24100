<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="02, GenAI Job Preparation Platform, solo and open source: AI career tools with the keys kept server-side. Interview generation, resume analysis and skill-gap detection all run on the server. The browser calls an Express API protected by JWT authentication and role-based access control, and only that server talks to Gemini and to MongoDB. The browser never holds a model key or a prompt. Built with React.js, Node.js, Express.js, MongoDB, Gemini AI and JWT.">
  <title>02 — GenAI Job Preparation Platform: keys kept server-side</title>

  <defs>
    <pattern id="g2" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#30363d" fill-opacity=".5"/>
    </pattern>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .s   { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
      .eb  { font-size: 12.5px; font-weight: 700; letter-spacing: 1.6px; fill: #58a6ff; }
      .ti  { font-size: 29px;   font-weight: 800; fill: #e6edf3; letter-spacing: -.6px; }
      .bd  { font-size: 15.5px; font-weight: 400; fill: #c9d1d9; }
      .pil { font-size: 12.5px; font-weight: 600; fill: #8b949e; }
      .nd  { font-size: 12.5px; font-weight: 600; fill: #e6edf3; }
      .sm  { font-size: 11px;   font-weight: 500; fill: #8b949e; }
      .cap { font-size: 12px;   font-weight: 400; fill: #8b949e; }
      .ln  { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#a2); }
    </style>
  </defs>

  <rect width="760" height="360" rx="14" fill="#0d1117"/>
  <rect width="760" height="360" rx="14" fill="url(#g2)"/>
  <path d="M0,14 A14,14 0 0 1 14,0 L14,360 A14,14 0 0 1 0,346 Z" fill="#3fb950"/>

  <!-- ══ left column ══ -->
  <text class="s eb" x="44" y="52">02 · GENAI JOB PREP · SOLO, OPEN SOURCE</text>
  <text class="s ti" x="44" y="100">AI career tools with</text>
  <text class="s ti" x="44" y="134">keys kept server-side</text>

  <text class="s bd" x="44" y="180">Interview generation, resume analysis</text>
  <text class="s bd" x="44" y="204">and skill-gap detection all run on the</text>
  <text class="s bd" x="44" y="228">server. The browser never holds a</text>
  <text class="s bd" x="44" y="252">model key or a prompt.</text>

  <g>
    <rect x="44"  y="288" width="76" height="26" rx="13" fill="#161b22" stroke="#21262d"/>
    <text class="s pil" x="82"  y="305" text-anchor="middle">React.js</text>
    <rect x="128" y="288" width="120" height="26" rx="13" fill="#161b22" stroke="#21262d"/>
    <text class="s pil" x="188" y="305" text-anchor="middle">Node · Express</text>
    <rect x="256" y="288" width="86" height="26" rx="13" fill="#161b22" stroke="#21262d"/>
    <text class="s pil" x="299" y="305" text-anchor="middle">MongoDB</text>
    <rect x="350" y="288" width="76" height="26" rx="13" fill="#161b22" stroke="#21262d"/>
    <text class="s pil" x="388" y="305" text-anchor="middle">Gemini</text>
  </g>

  <!-- ══ right: the mechanism ══ -->
  <g>
    <!-- browser -->
    <rect x="458" y="52" width="112" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
    <text class="s nd" x="514" y="71" text-anchor="middle">browser</text>

    <!-- blocked direct path -->
    <path d="M578,68 L668,68" stroke="#f85149" stroke-width="1.4" stroke-dasharray="4 4" fill="none"/>
    <g stroke="#f85149" stroke-width="2">
      <path d="M617,61 L631,75"/><path d="M631,61 L617,75"/>
    </g>
    <text class="s sm" x="676" y="72" fill="#f85149">no direct key</text>

    <!-- API -->
    <rect x="440" y="136" width="192" height="34" rx="7" fill="#161b22" stroke="#3fb950"/>
    <text class="s nd" x="536" y="151" text-anchor="middle">Express API</text>
    <text class="s sm" x="536" y="165" text-anchor="middle">JWT · role-based access</text>
    <path class="ln" d="M514,86 L514,132"/>

    <!-- Gemini + Mongo -->
    <rect x="452" y="222" width="96" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
    <text class="s nd" x="500" y="241" text-anchor="middle">MongoDB</text>
    <rect x="576" y="222" width="96" height="30" rx="7" fill="#161b22" stroke="#58a6ff"/>
    <text class="s nd" x="624" y="241" text-anchor="middle">Gemini</text>
    <path class="ln" d="M510,174 L502,218"/>
    <path class="ln" d="M566,174 L614,218"/>
    <circle r="3" fill="#3fb950">
      <animateMotion dur="2.6s" repeatCount="indefinite" path="M514,90 L514,130"/>
    </circle>

    <!-- the three features -->
    <text class="s sm" x="440" y="282">3 features</text>
    <text class="s cap" x="440" y="300">interview · resume · skill-gap</text>
  </g>

  <text class="s cap" x="440" y="330">every model call leaves from the server</text>

  <rect x=".75" y=".75" width="758.5" height="358.5" rx="14" fill="none" stroke="#21262d" stroke-width="1.5"/>
</svg>
