<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 594" width="1280" height="594" role="img" aria-label="Featured projects. Blaze Tingg, an AI content and marketing automation platform in production, covering 3 content types, built with Next.js, Python, OpenAI, Claude, Material UI, REST APIs and Nginx. GenAI Job Preparation Platform, solo and open source, with 3 AI features, built with React.js, Node.js, Express.js, MongoDB, Gemini AI and JWT. GNCreators, a creator growth and automation platform in production, with 8 responsive modules, built with React.js, JavaScript, Material UI, Meta APIs and REST APIs.">
  <title>Pooja Tanwar — Featured Projects</title>

  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="62%"  stop-color="#FBFCFE"/>
      <stop offset="100%" stop-color="#F4F7FB"/>
    </linearGradient>
    <radialGradient id="tint" cx="10%" cy="4%" r="58%">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity=".055"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tint2" cx="94%" cy="96%" r="52%">
      <stop offset="0%"   stop-color="#0EA5E9" stop-opacity=".045"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#CBD5E1" fill-opacity=".38"/>
    </pattern>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E2E8F0" stop-opacity="0"/>
      <stop offset="7%"   stop-color="#E2E8F0"/>
      <stop offset="93%"  stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="card" x="-10%" y="-25%" width="120%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#0F172A" flood-opacity=".050"/>
    </filter>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="592" rx="22" ry="22"/></clipPath>
    <style>
      .sans   { font-family: 'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
      .kicker { font-size: 11.5px; font-weight: 600; letter-spacing: 2.4px; fill: #94A3B8; }
      .num    { font-size: 42px;   font-weight: 700; fill: #4F46E5; }
      .numlbl { font-size: 10px;   font-weight: 600; letter-spacing: 1.3px; fill: #94A3B8; }
      .name   { font-size: 24px;   font-weight: 700; fill: #0F172A; letter-spacing: -.5px; }
      .desc   { font-size: 14.5px; font-weight: 400; fill: #475569; }
      .stack  { font-size: 12.5px; font-weight: 500; fill: #64748B; }
      .chip   { font-size: 10px;   font-weight: 700; letter-spacing: 1.2px; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="1" y="1" width="1278" height="592" fill="url(#surface)"/>
    <rect x="1" y="1" width="1278" height="592" fill="url(#dots)"/>
    <rect x="1" y="1" width="1278" height="592" fill="url(#tint)"/>
    <rect x="1" y="1" width="1278" height="592" fill="url(#tint2)"/>

    <text class="sans kicker" x="46" y="38">FEATURED PROJECTS</text>
    <rect x="46" y="54" width="1188" height="1" fill="url(#hair)"/>

    <!-- ════ 1 · BLAZE TINGG ════ -->
    <g filter="url(#card)">
      <rect x="46" y="76" width="1188" height="154" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    </g>
    <rect x="46" y="76" width="64" height="3" rx="1.5" fill="url(#rule)"/>
    <text class="sans num"    x="88" y="152">3</text>
    <text class="sans numlbl" x="88" y="172">CONTENT TYPES</text>
    <rect x="200" y="106" width="1" height="94" fill="#E2E8F0"/>
    <text class="sans name" x="236" y="126">Blaze Tingg</text>
    <rect x="392" y="108" width="92" height="20" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text class="sans chip" x="438" y="122" fill="#4338CA" text-anchor="middle">PRODUCTION</text>
    <text class="sans desc"  x="236" y="158">AI content and marketing automation platform. Editable multi-step pipelines with review, approval, regeneration and asynchronous processing.</text>
    <text class="sans stack" x="236" y="190">Next.js  ·  Python  ·  OpenAI  ·  Claude  ·  Material UI  ·  REST APIs  ·  Nginx</text>

    <!-- ════ 2 · GENAI JOB PREPARATION PLATFORM ════ -->
    <g filter="url(#card)">
      <rect x="46" y="256" width="1188" height="154" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    </g>
    <rect x="46" y="256" width="64" height="3" rx="1.5" fill="url(#rule)"/>
    <text class="sans num"    x="88" y="332">3</text>
    <text class="sans numlbl" x="88" y="352">AI FEATURES</text>
    <rect x="200" y="286" width="1" height="94" fill="#E2E8F0"/>
    <text class="sans name" x="236" y="306">GenAI Job Preparation Platform</text>
    <rect x="712" y="288" width="110" height="20" rx="10" fill="#F1F5F9" stroke="#E2E8F0"/>
    <text class="sans chip" x="767" y="302" fill="#475569" text-anchor="middle">OPEN SOURCE</text>
    <text class="sans desc"  x="236" y="338">Gemini AI running server-side for interview generation, resume analysis and skill-gap detection, behind JWT auth and role-based access control.</text>
    <text class="sans stack" x="236" y="370">React.js  ·  Node.js  ·  Express.js  ·  MongoDB  ·  Gemini AI  ·  JWT</text>

    <!-- ════ 3 · GNCREATORS ════ -->
    <g filter="url(#card)">
      <rect x="46" y="436" width="1188" height="154" rx="16" fill="#FFFFFF" stroke="#E2E8F0"/>
    </g>
    <rect x="46" y="436" width="64" height="3" rx="1.5" fill="url(#rule)"/>
    <text class="sans num"    x="88" y="512">8</text>
    <text class="sans numlbl" x="88" y="532">MODULES</text>
    <rect x="200" y="466" width="1" height="94" fill="#E2E8F0"/>
    <text class="sans name" x="236" y="486">GNCreators</text>
    <rect x="404" y="468" width="92" height="20" rx="10" fill="#EEF2FF" stroke="#C7D2FE"/>
    <text class="sans chip" x="450" y="482" fill="#4338CA" text-anchor="middle">PRODUCTION</text>
    <text class="sans desc"  x="236" y="518">Creator growth and automation platform. Instagram and Facebook API integration with 4 permission-aware states for every connection.</text>
    <text class="sans stack" x="236" y="550">React.js  ·  JavaScript  ·  Material UI  ·  Meta APIs  ·  REST APIs</text>

    <rect x="1" y="1" width="1278" height="592" rx="22" ry="22" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
</svg>
