<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="Pooja Tanwar, Software Engineer and Full-Stack Developer, React.js, Next.js, Node.js, Python and Generative AI, Noida India">
  <title>Pooja Tanwar — Software Engineer, Full-Stack Developer, Generative AI</title>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#170F3E"/>
      <stop offset="45%"  stop-color="#312E81"/>
      <stop offset="78%"  stop-color="#4C1D95"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>

    <radialGradient id="blobA" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#8B5CF6" stop-opacity=".78"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#22D3EE" stop-opacity=".42"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobC" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#F472B6" stop-opacity=".34"/>
      <stop offset="100%" stop-color="#F472B6" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#A78BFA" stop-opacity="0"/>
      <stop offset="22%"  stop-color="#A78BFA" stop-opacity=".95"/>
      <stop offset="78%"  stop-color="#67E8F9" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="45%"  stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="55%"  stop-color="#FFFFFF" stop-opacity=".78"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0 L0 0 0 44" fill="none" stroke="#C4B5FD" stroke-opacity=".10" stroke-width="1"/>
    </pattern>

    <clipPath id="card">
      <rect x="0" y="0" width="1280" height="340" rx="26" ry="26"/>
    </clipPath>

    <mask id="sheenMask">
      <rect x="0" y="0" width="1280" height="340" fill="#000"/>
      <rect class="sweep" x="-520" y="0" width="380" height="340" fill="url(#sheen)"/>
    </mask>

    <style>
      .t { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

      .blob { transform-box: fill-box; transform-origin: center; }
      .b1 { animation: driftA 19s ease-in-out infinite; }
      .b2 { animation: driftB 23s ease-in-out infinite; }
      .b3 { animation: driftC 27s ease-in-out infinite; }

      @keyframes driftA {
        0%,100% { transform: translate(0,0) scale(1); }
        50%     { transform: translate(64px,26px) scale(1.14); }
      }
      @keyframes driftB {
        0%,100% { transform: translate(0,0) scale(1.06); }
        50%     { transform: translate(-58px,-22px) scale(.9); }
      }
      @keyframes driftC {
        0%,100% { transform: translate(0,0) scale(.95); }
        50%     { transform: translate(38px,-34px) scale(1.18); }
      }

      .sweep { animation: sweep 7s cubic-bezier(.4,0,.2,1) infinite; }
      @keyframes sweep {
        0%      { transform: translateX(0); }
        62%,100%{ transform: translateX(1900px); }
      }

      .caret { animation: blink 1.15s steps(1) infinite; }
      @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }

      .chip  { animation: rise .9s ease-out both; }
      .c1{animation-delay:.10s} .c2{animation-delay:.20s} .c3{animation-delay:.30s}
      .c4{animation-delay:.40s} .c5{animation-delay:.50s} .c6{animation-delay:.60s}
      @keyframes rise { from { opacity:0; transform:translateY(9px) } to { opacity:1; transform:translateY(0) } }

      .pulse { animation: pulse 2.6s ease-in-out infinite; }
      @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }

      @media (prefers-reduced-motion: reduce) {
        .b1,.b2,.b3,.sweep,.caret,.chip,.pulse { animation: none; }
        .chip { opacity: 1; }
      }
    </style>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="340" fill="url(#bg)"/>
    <rect width="1280" height="340" fill="url(#grid)"/>

    <g class="blob b1"><ellipse cx="228" cy="96"  rx="290" ry="200" fill="url(#blobA)"/></g>
    <g class="blob b2"><ellipse cx="1076" cy="268" rx="330" ry="220" fill="url(#blobB)"/></g>
    <g class="blob b3"><ellipse cx="880" cy="52"  rx="250" ry="170" fill="url(#blobC)"/></g>

    <!-- left accent bar -->
    <rect x="74" y="96" width="4" height="148" rx="2" fill="#A78BFA" opacity=".85"/>

    <!-- eyebrow -->
    <g transform="translate(98,118)">
      <circle cx="5" cy="-5" r="4.5" fill="#34D399" class="pulse"/>
      <text class="mono" x="20" y="0" fill="#C7D2FE" font-size="16" letter-spacing="3.4">NOIDA, INDIA</text>
    </g>

    <!-- name -->
    <text class="t" x="96" y="196" fill="#FFFFFF" font-size="72" font-weight="700" letter-spacing="-1.4">Pooja Tanwar</text>

    <!-- gradient rule -->
    <rect x="98" y="220" width="500" height="2.5" rx="1.25" fill="url(#rule)"/>

    <!-- role -->
    <text class="t" x="98" y="256" fill="#E4DEFF" font-size="25" font-weight="600" letter-spacing=".3">Software Engineer
      <tspan fill="#8B85D6"> · </tspan>Full-Stack Developer<tspan fill="#8B85D6"> · </tspan>Generative AI</text>

    <!-- tech chips -->
    <g transform="translate(98,288)">
      <g class="chip c1"><rect x="0"   y="0" width="86"  height="30" rx="15" fill="#FFFFFF" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".38"/><text class="mono" x="43"  y="20" fill="#E9E5FF" font-size="14" text-anchor="middle">React.js</text></g>
      <g class="chip c2"><rect x="96"  y="0" width="82"  height="30" rx="15" fill="#FFFFFF" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".38"/><text class="mono" x="137" y="20" fill="#E9E5FF" font-size="14" text-anchor="middle">Next.js</text></g>
      <g class="chip c3"><rect x="188" y="0" width="88"  height="30" rx="15" fill="#FFFFFF" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".38"/><text class="mono" x="232" y="20" fill="#E9E5FF" font-size="14" text-anchor="middle">Node.js</text></g>
      <g class="chip c4"><rect x="286" y="0" width="98"  height="30" rx="15" fill="#FFFFFF" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".38"/><text class="mono" x="335" y="20" fill="#E9E5FF" font-size="14" text-anchor="middle">TypeScript</text></g>
      <g class="chip c5"><rect x="394" y="0" width="78"  height="30" rx="15" fill="#FFFFFF" fill-opacity=".10" stroke="#A78BFA" stroke-opacity=".38"/><text class="mono" x="433" y="20" fill="#E9E5FF" font-size="14" text-anchor="middle">Python</text></g>
      <g class="chip c6"><rect x="482" y="0" width="128" height="30" rx="15" fill="#A78BFA" fill-opacity=".20" stroke="#C4B5FD" stroke-opacity=".55"/><text class="mono" x="546" y="20" fill="#F3F0FF" font-size="14" text-anchor="middle">OpenAI · Claude</text></g>
    </g>

    <!-- right: terminal card -->
    <g transform="translate(846,84)" opacity=".97">
      <rect x="0" y="0" width="360" height="172" rx="13" fill="#0B0820" fill-opacity=".62" stroke="#A78BFA" stroke-opacity=".28"/>
      <circle cx="22" cy="24" r="5.5" fill="#F87171"/>
      <circle cx="42" cy="24" r="5.5" fill="#FBBF24"/>
      <circle cx="62" cy="24" r="5.5" fill="#34D399"/>
      <text class="mono" x="22" y="66"  fill="#67E8F9" font-size="13.5">const pooja = {</text>
      <text class="mono" x="38" y="90"  fill="#C4B5FD" font-size="13.5">experience: <tspan fill="#FDE68A">'1.5+ yrs'</tspan>,</text>
      <text class="mono" x="38" y="114" fill="#C4B5FD" font-size="13.5">shipped: <tspan fill="#FDE68A">'5 products'</tspan>,</text>
      <text class="mono" x="38" y="138" fill="#C4B5FD" font-size="13.5">focus: <tspan fill="#FDE68A">'AI workflows'</tspan></text>
      <text class="mono" x="22" y="162" fill="#67E8F9" font-size="13.5">}</text>
      <rect class="caret" x="33" y="151" width="8" height="14" rx="1" fill="#A78BFA"/>
    </g>

    <!-- sheen sweep across everything -->
    <rect width="1280" height="340" fill="#FFFFFF" fill-opacity=".055" mask="url(#sheenMask)"/>

    <rect x="1" y="1" width="1278" height="338" rx="26" ry="26" fill="none" stroke="#A78BFA" stroke-opacity=".30" stroke-width="1.5"/>
  </g>
</svg>
