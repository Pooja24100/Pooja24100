<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="03, GNCreators, in production: 8 creator modules on live Meta APIs. Profiles, Instagram insights, campaigns, DM automation, lead magnets, giveaways, Link-in-Bio and media performance. Every Instagram and Facebook connection resolves to one of 4 permission-aware states: disconnected account, empty data, expired token or rate-limited response, and each state has its own designed screen. Built with React.js, JavaScript, Material UI, Meta APIs and REST APIs.">
  <title>03 — GNCreators: 8 creator modules on live Meta APIs</title>

  <defs>
    <pattern id="g3" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#30363d" fill-opacity=".5"/>
    </pattern>
    <marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
    <style>
      .s   { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
      .eb  { font-size: 12.5px; font-weight: 700; letter-spacing: 1.6px; fill: #58a6ff; }
      .ti  { font-size: 29px;   font-weight: 800; fill: #e6edf3; letter-spacing: -.6px; }
      .bd  { font-size: 15.5px; font-weight: 400; fill: #c9d1d9; }
      .pil { font-size: 12.5px; font-weight: 600; fill: #8b949e; }
      .nd  { font-size: 12.5px; font-weight: 600; fill: #e6edf3; }
      .st  { font-size: 12px;   font-weight: 500; fill: #c9d1d9; }
      .cap { font-size: 12px;   font-weight: 400; fill: #8b949e; }
      .ln  { stroke: #8b949e; stroke-width: 1.5; fill: none; marker-end: url(#a3); }
    </style>
  </defs>

  <rect width="760" height="360" rx="14" fill="#0d1117"/>
  <rect width="760" height="360" rx="14" fill="url(#g3)"/>
  <path d="M0,14 A14,14 0 0 1 14,0 L14,360 A14,14 0 0 1 0,346 Z" fill="#d29922"/>

  <!-- ══ left column ══ -->
  <text class="s eb" x="44" y="52">03 · GNCREATORS · IN PRODUCTION</text>
  <text class="s ti" x="44" y="100">8 creator modules</text>
  <text class="s ti" x="44" y="134">on live Meta APIs</text>

  <text class="s bd" x="44" y="180">Profiles, Instagram insights, campaigns,</text>
  <text class="s bd" x="44" y="204">DM automation, lead magnets, giveaways,</text>
  <text class="s bd" x="44" y="228">Link-in-Bio and media performance — each</text>
  <text class="s bd" x="44" y="252">reading live from Meta.</text>

  <g>
    <rect x="44"  y="288" width="76" height="26" rx="13" fill="#161b22" stroke="#21262d"/>
    <text class="s pil" x="82"  y="305" text-anchor="middle">React.js</text>
    <rect x="128" y="288" width="98" height="26" rx="13" fill="#161b22" stroke="#21262d"/>
    <text class="s pil" x="177" y="305" text-anchor="middle">Material UI</text>
    <rect x="234" y="288" width="88" height="26" rx="13" fill="#161b22" stroke="#21262d"/>
    <text class="s pil" x="278" y="305" text-anchor="middle">Meta APIs</text>
    <rect x="330" y="288" width="86" height="26" rx="13" fill="#161b22" stroke="#21262d"/>
    <text class="s pil" x="373" y="305" text-anchor="middle">REST APIs</text>
  </g>

  <!-- ══ right: the 4 permission-aware states ══ -->
  <g>
    <rect x="474" y="44" width="200" height="32" rx="7" fill="#161b22" stroke="#58a6ff"/>
    <text class="s nd" x="574" y="64" text-anchor="middle">Instagram · Facebook API</text>
    <path class="ln" d="M574,80 L574,100"/>

    <rect x="454" y="106" width="240" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
    <circle cx="472" cy="121" r="4.5" fill="#8b949e"/>
    <text class="s st" x="488" y="125">disconnected account</text>

    <rect x="454" y="146" width="240" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
    <circle cx="472" cy="161" r="4.5" fill="#58a6ff"/>
    <text class="s st" x="488" y="165">empty data</text>

    <rect x="454" y="186" width="240" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
    <circle cx="472" cy="201" r="4.5" fill="#f85149"/>
    <text class="s st" x="488" y="205">expired token</text>

    <rect x="454" y="226" width="240" height="30" rx="7" fill="#161b22" stroke="#30363d"/>
    <circle cx="472" cy="241" r="4.5" fill="#d29922"/>
    <text class="s st" x="488" y="245">rate-limited response</text>

    <path class="ln" d="M574,260 L574,280"/>
    <rect x="474" y="286" width="200" height="30" rx="7" fill="#161b22" stroke="#3fb950"/>
    <text class="s nd" x="574" y="305" text-anchor="middle">a screen designed for each</text>

    <circle r="3" fill="#58a6ff">
      <animateMotion dur="2.4s" repeatCount="indefinite" path="M574,82 L574,98"/>
    </circle>
  </g>

  <text class="s cap" x="44" y="338">4 permission-aware states — the UI never guesses</text>

  <rect x=".75" y=".75" width="758.5" height="358.5" rx="14" fill="none" stroke="#21262d" stroke-width="1.5"/>
</svg>
