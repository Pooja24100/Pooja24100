<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330" role="img" aria-label="Pooja Tanwar, Software Engineer and Full-Stack Developer specialising in React.js, Next.js, Node.js and Generative AI. Based in Noida, India. More than 1.5 years of experience and 5 production products delivered.">
  <title>Pooja Tanwar — Software Engineer, Full-Stack Developer, Generative AI</title>

  <defs>
    <linearGradient id="surface" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#FFFFFF"/>
      <stop offset="62%"  stop-color="#FBFCFE"/>
      <stop offset="100%" stop-color="#F4F7FB"/>
    </linearGradient>

    <radialGradient id="tint" cx="14%" cy="6%" r="62%">
      <stop offset="0%"   stop-color="#4F46E5" stop-opacity=".070"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tint2" cx="88%" cy="96%" r="56%">
      <stop offset="0%"   stop-color="#6366F1" stop-opacity=".055"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="accentRule" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>

    <linearGradient id="hairline" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#E2E8F0" stop-opacity="0"/>
      <stop offset="18%"  stop-color="#E2E8F0"/>
      <stop offset="82%"  stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#E2E8F0" stop-opacity="0"/>
    </linearGradient>

    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.25" fill="#CBD5E1" fill-opacity=".45"/>
    </pattern>

    <filter id="cardShadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity=".055"/>
    </filter>

    <clipPath id="frame">
      <rect x="1" y="1" width="1278" height="328" rx="22" ry="22"/>
    </clipPath>

    <style>
      .sans { font-family: 'Inter', 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

      .drift { transform-box: fill-box; transform-origin: center; animation: drift 26s ease-in-out infinite; }
      @keyframes drift { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(34px,16px) scale(1.09)} }

      .caret { animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 0%,52%{opacity:1} 53%,100%{opacity:0} }

      .live { animation: live 2.8s ease-in-out infinite; }
      @keyframes live { 0%,100%{opacity:.4} 50%{opacity:1} }

      @media (prefers-reduced-motion: reduce) {
        .drift,.caret,.live { animation: none; }
      }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect x="1" y="1" width="1278" height="328" fill="url(#surface)"/>
    <rect x="1" y="1" width="1278" height="328" fill="url(#dots)"/>
    <g class="drift"><rect x="1" y="1" width="1278" height="328" fill="url(#tint)"/></g>
    <rect x="1" y="1" width="1278" height="328" fill="url(#tint2)"/>

    <!-- ── left column ─────────────────────────────────────────── -->

    <!-- eyebrow -->
    <g transform="translate(80,74)">
      <circle class="live" cx="4" cy="-4.5" r="3.6" fill="#4F46E5"/>
      <text class="sans" x="17" y="0" fill="#64748B" font-size="13.5" font-weight="600" letter-spacing="2.6">NOIDA, INDIA</text>
    </g>

    <!-- name -->
    <text class="sans" x="78" y="146" fill="#0F172A" font-size="62" font-weight="700" letter-spacing="-1.6">Pooja Tanwar</text>

    <!-- short accent rule -->
    <rect x="80" y="168" width="76" height="3" rx="1.5" fill="url(#accentRule)"/>

    <!-- role -->
    <text class="sans" x="80" y="204" fill="#334155" font-size="22" font-weight="500" letter-spacing="-.1">Software Engineer<tspan fill="#CBD5E1">   ·   </tspan>Full-Stack Developer<tspan fill="#CBD5E1">   ·   </tspan>Generative AI</text>

    <!-- one-line intro -->
    <text class="sans" x="80" y="234" fill="#64748B" font-size="16" font-weight="400">Building responsive applications, backend services and multi-step AI workflows.</text>

    <!-- hairline -->
    <rect x="80" y="258" width="560" height="1" fill="url(#hairline)"/>

    <!-- stat strip -->
    <g transform="translate(80,280)">
      <text class="sans" x="0"   y="0"  fill="#0F172A" font-size="21" font-weight="700">1.5+</text>
      <text class="sans" x="0"   y="18" fill="#94A3B8" font-size="11.5" font-weight="600" letter-spacing="1.4">YEARS EXPERIENCE</text>

      <rect x="150" y="-12" width="1" height="32" fill="#E2E8F0"/>

      <text class="sans" x="178" y="0"  fill="#0F172A" font-size="21" font-weight="700">5</text>
      <text class="sans" x="178" y="18" fill="#94A3B8" font-size="11.5" font-weight="600" letter-spacing="1.4">PRODUCTION PRODUCTS</text>

      <rect x="356" y="-12" width="1" height="32" fill="#E2E8F0"/>

      <text class="sans" x="384" y="0"  fill="#0F172A" font-size="21" font-weight="700">3</text>
      <text class="sans" x="384" y="18" fill="#94A3B8" font-size="11.5" font-weight="600" letter-spacing="1.4">AI CONTENT TYPES</text>
    </g>

    <!-- ── right: light code card ──────────────────────────────── -->
    <g transform="translate(818,66)" filter="url(#cardShadow)">
      <rect x="0" y="0" width="384" height="198" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1"/>
      <rect x="0" y="0" width="384" height="38" rx="14" fill="#F8FAFC"/>
      <rect x="0" y="37.5" width="384" height="1" fill="#E2E8F0"/>
      <circle cx="21" cy="19" r="4.6" fill="#E2E8F0"/>
      <circle cx="37" cy="19" r="4.6" fill="#E2E8F0"/>
      <circle cx="53" cy="19" r="4.6" fill="#E2E8F0"/>
      <text class="mono" x="72" y="23" fill="#94A3B8" font-size="11.5">stack.ts</text>

      <text class="mono" x="22" y="68"  fill="#94A3B8" font-size="11">1</text>
      <text class="mono" x="42" y="68"  fill="#4F46E5" font-size="12.8">const</text>
      <text class="mono" x="88" y="68"  fill="#0F172A" font-size="12.8">stack</text>
      <text class="mono" x="132" y="68" fill="#64748B" font-size="12.8">= {</text>

      <text class="mono" x="22" y="94"  fill="#94A3B8" font-size="11">2</text>
      <text class="mono" x="58" y="94"  fill="#475569" font-size="12.8">web:</text>
      <text class="mono" x="100" y="94" fill="#0F766E" font-size="12.8">'React · Next.js'</text>
      <text class="mono" x="233" y="94" fill="#64748B" font-size="12.8">,</text>

      <text class="mono" x="22" y="120"  fill="#94A3B8" font-size="11">3</text>
      <text class="mono" x="58" y="120"  fill="#475569" font-size="12.8">api:</text>
      <text class="mono" x="100" y="120" fill="#0F766E" font-size="12.8">'Node · Python'</text>
      <text class="mono" x="217" y="120" fill="#64748B" font-size="12.8">,</text>

      <text class="mono" x="22" y="146"  fill="#94A3B8" font-size="11">4</text>
      <text class="mono" x="58" y="146"  fill="#475569" font-size="12.8">ai:</text>
      <text class="mono" x="92" y="146"  fill="#0F766E" font-size="12.8">'OpenAI · Claude'</text>

      <text class="mono" x="22" y="172"  fill="#94A3B8" font-size="11">5</text>
      <text class="mono" x="42" y="172"  fill="#64748B" font-size="12.8">}</text>
      <rect class="caret" x="54" y="162" width="7" height="13" rx="1" fill="#4F46E5"/>
    </g>

    <rect x="1" y="1" width="1278" height="328" rx="22" ry="22" fill="none" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
</svg>
