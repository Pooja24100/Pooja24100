<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 442" width="1280" height="442" role="img" aria-label="Technical skills. Frontend: React.js, Next.js with App Router, SSR, ISR and SSG, Redux, React Hooks, Context API, HTML5, CSS3, Tailwind CSS, Material UI, Bootstrap, Responsive Web Design. Backend: Node.js, Express.js, Python, FastAPI, MVC Architecture. APIs and Authentication: REST API Design, JWT Authentication, Role-Based Access Control, OAuth with Google and Firebase. Databases: MongoDB, MySQL, Firebase, Data Modeling. AI and Generative AI: OpenAI API, Claude API, Gemini AI, LLM Applications, Prompt Engineering, Multi-Step AI Workflows, AI Workflow Orchestration. Languages: JavaScript ES6 plus, TypeScript, Python, SQL, Core Java. DevOps and Cloud: Nginx, Docker, HTTPS and SSL. Tools and Collaboration: Git, GitHub, Postman, Code Review, Testing, Debugging.">
  <title>Pooja Tanwar — Technical Skills</title>

  <defs>
