      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#475569" fill-opacity=".50"/>
    </pattern>
    <linearGradient id="hair" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#1E293B" stop-opacity="0"/>
      <stop offset="7%"   stop-color="#1E293B"/>
      <stop offset="93%"  stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="1278" height="440" rx="22" ry="22"/></clipPath>
    <style>
      .sans   { font-family: 'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif; }
